<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
      background: #fff;
      width: 100%;
      height: 100%;
    }
    #main {
      width: 80%;
      margin: 0 auto;
      background: #ddd;
      height: 100%;
      padding-top: 20px;
    }
    h1 {
      font-size: 1.5rem;
      text-align: center;
    }
  </style>
</head>

<body>
<div id="main"><h1>Demonstration of embedding Grace Cathedral in iframe</h1>

<!-- copy from here on to embed the grace cathedral iframe -->
<iframe
  id="grace-cathedral-tour"
  src="https://vincentwoo.com/3d/grace_cathedral?iframe"
  title="Grace Cathedral interactive tour"
  allow="fullscreen"
  allowfullscreen
  style="width: 100%; height: 70vh; border: 0; display: block;"
></iframe>

<script>
(() => {
  const tour = document.getElementById('grace-cathedral-tour');
  const tourOrigin = new URL(tour.src, window.location.href).origin;
  const fullscreenClass = 'grace-cathedral-tour-fullscreen';

  const style = document.createElement('style');
  style.textContent = `
    .${fullscreenClass} {
      position: fixed !important;
      inset: 0 !important;
      z-index: 2147483647 !important;
      width: 100vw !important;
      height: 100dvh !important;
      max-width: none !important;
      max-height: none !important;
      border: 0 !important;
      background: #000 !important;
    }

    body:has(.${fullscreenClass}) {
      overflow: hidden;
    }
  `;
  document.head.appendChild(style);

  window.addEventListener('message', (event) => {
    if (event.origin !== tourOrigin) return;
    if (event.data?.type !== 'grace-cathedral:fullscreen') return;

    tour.classList.toggle(fullscreenClass, Boolean(event.data.active));
  });
})();
</script>
<!-- stop copying here -->

</div>
</body>
</html>
